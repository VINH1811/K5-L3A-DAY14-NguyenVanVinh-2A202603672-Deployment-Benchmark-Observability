name: quality-gate
on: [pull_request]
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run agent and eval
        working-directory: 06-lab-complete/benchmark-observability/develop
        run: |
          pip install -r requirements.txt
          AGENT_VERSION=v2 PORT=8002 MOCK_ERROR_RATE=0 python app.py &
          timeout 30 sh -c 'until curl -fs http://localhost:8002/health; do sleep 1; done'
          # Exit code 1 (accuracy < 85%) làm job fail; đặt job là required check để chặn merge.
          python eval/run_eval.py --url http://localhost:8002 --min-accuracy 0.85
